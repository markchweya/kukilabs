<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">Kuki the whale plushie</title>
  <defs>
    <!-- Soft plush shading: lighter on top, deeper towards the bottom -->
    <radialGradient id="body" cx="40%" cy="30%" r="80%">
      <stop offset="0" stop-color="#8DB4FF"/>
      <stop offset=".55" stop-color="#5E8FF0"/>
      <stop offset="1" stop-color="#3F6FD6"/>
    </radialGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8EE"/>
      <stop offset="1" stop-color="#F1E6D6"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <path d="M38 150C38 98 88 70 140 72c48 2 76 32 74 70-2 36-36 62-86 62-56 0-90-18-90-54Z"/>
    </clipPath>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="128" cy="222" rx="78" ry="9" fill="#0F172A" opacity=".10"/>

  <!-- Tail: a chunky two-lobed fluke, sewn on behind the body -->
  <path d="M192 150c20-8 30-26 30-48-14-2-26-14-22-32 14 4 22 14 26 24 6-10 18-16 30-12-2 18-14 28-28 28-2 22-14 40-32 50Z" fill="#4F80E4"/>
  <path d="M206 80c6 3 10 8 13 14M236 92c-4 4-8 6-12 6" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="2" stroke-dasharray="3 4" stroke-linecap="round"/>

  <!-- Body -->
  <path d="M38 150C38 98 88 70 140 72c48 2 76 32 74 70-2 36-36 62-86 62-56 0-90-18-90-54Z" fill="url(#body)"/>

  <!-- Cream belly panel, clipped to the body -->
  <g clip-path="url(#bodyClip)">
    <path d="M30 160c30 22 140 30 190-8v70H30Z" fill="url(#belly)"/>
    <path d="M40 166c32 20 132 26 176-10" fill="none" stroke="#C9B79E" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>
  </g>

  <!-- Seam stitching along the back -->
  <path d="M62 108c22-24 60-32 96-26" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="2.2" stroke-dasharray="4 5" stroke-linecap="round"/>

  <!-- Flipper -->
  <path d="M118 176c-2 18 8 32 26 34 4-14-6-28-26-34Z" fill="#4A7BE0"/>

  <!-- Button eye with highlight -->
  <circle cx="84" cy="136" r="9" fill="#14182B"/>
  <circle cx="87" cy="132.5" r="3" fill="#FFFFFF"/>

  <!-- Blush and stitched smile -->
  <ellipse cx="78" cy="157" rx="10" ry="6" fill="#FF8FA3" opacity=".75"/>
  <path d="M97 152c4 6 12 6 16 0" fill="none" stroke="#14182B" stroke-width="3" stroke-linecap="round"/>

  <!-- Spout: three water droplets in Kuki's original logo colours -->
  <path d="M106 74c0-6 0-10 2-14" fill="none" stroke="#7DD3FC" stroke-width="5" stroke-linecap="round"/>
  <path transform="rotate(0 108 44)" d="M108 32.0C116 41.6 116 52 108 52S100 41.6 108 32.0Z" fill="#2563EB"/>
  <path transform="rotate(-35 86 56)" d="M86 46.25C92.5 54.05 92.5 62.5 86 62.5S79.5 54.05 86 46.25Z" fill="#14B8A6"/>
  <path transform="rotate(35 130 56)" d="M130 46.25C136.5 54.05 136.5 62.5 130 62.5S123.5 54.05 130 46.25Z" fill="#38BDF8"/>
</svg>
